<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Incident</title>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="incident_list.html">Incident list</a></li>
                <li><a href="create_incident.html">Create incident</a></li>
                <li><a href="logs_and_analysis.html">Logs and analysis</a></li>
                <li><a href="manage_user_accounts.html">Manage user accounts</a></li>
                <li><a href="view_incident_analytics.html">Incident analytics</a></li>
                <li><a href="view_incident_details.html">Incident details</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Create an incident</h1>
        <p>Provide the details below to document a new incident.</p>
        <form>
            <p>
                <label for="title">Incident title</label>
                <input type="text" id="title" name="title" placeholder="For example, suspicious login activity" required>
            </p>
            <p>
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" placeholder="Describe what happened, when it occurred, and who or what is affected." required></textarea>
            </p>
            <p>
                <label for="severity">Severity</label>
                <select id="severity" name="severity" required>
                    <option value="">Select severity</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </p>
            <p>
                <label for="affected-system">Affected system</label>
                <input type="text" id="affected-system" name="affected-system" placeholder="Enter an affected system">
            </p>
            <p>
                <label for="evidence">Attach evidence</label>
                <input type="file" id="evidence" name="evidence">
            </p>
            <button type="submit">Submit incident</button>
        </form>
    </main>
    <footer>
        <p>Incident Response Portal</p>
    </footer>
</body>
</html>
