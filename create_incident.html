<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css">
    <title>Create Incident</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="incident_list.html">Incident list</a></li>
          <li><a href="create_incident.html">Create incident</a></li>
          <li><a href="logs_and_analysis.html">Logs and analysis</a></li>
          <li><a href="manage_user_accounts.html">Manage user accounts</a></li>
          <li><a href="view_incident_analytics.html">Incident analytics</a></li>
          <li><a href="view_incident_details.html">Incident details</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Create an incident</h1>
      <p>Provide the details below to document a new incident.</p>
      <form>
        <label>Incident title</label><br />
        <input
          type="text"
          id="title"
          name="title"
          placeholder="For example, suspicious login activity"
          required
        /><br />
        <label>Description</label><br />
        <textarea
          id="description"
          name="description"
          rows="5"
          placeholder="Describe the incident"
          required
        ></textarea
        ><br />
        <label>Severity</label><br />
        <select id="severity" name="severity" required>
          <option value="">Select severity</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option></select
        ><br />
        <label>Affected system</label> <br />
        <input
          type="text"
          id="affected-system"
          name="affected-system"
          placeholder="Enter affected system"
        /><br />
        <label>Attach evidence</label><br />
        <input type="file" id="evidence" name="evidence" /><br />
        <label>Time and date</label><br />
        <input type="datetime-local" id="time-date" name="time-date" /> <br />
        <button type="submit">Submit incident</button>
      </form>
    </main>
    <footer>
      <p>Incident Response Portal</p>
    </footer>
  </body>
</html>
